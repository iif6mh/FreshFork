<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Edit Recipe</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: "Inter", sans-serif;
            background-color: #FFFDF2;
            color: #333;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .container {
            max-width: 1200px;
            margin: 30px auto;
            padding: 2rem;
            background-color: #FFFDF2;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        h1 {
            font-size: 2.3rem;
            font-weight: bold;
            color: #4e774e;
            text-align: center;
            margin-bottom: 2rem;
        }

        .form-section {
            margin-bottom: 2rem;
        }

        .form-section h3 {
            font-size: 1.4rem;
            font-weight: 600;
            color: #4e774e;
            margin-bottom: 1rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
            color: #333;
        }

        input[type="text"],
        input[type="number"],
        textarea {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 1rem;
            background-color: white;
            color: #333;
        }
        
        /* Styles for the new image upload area */
        .image-upload-area {
            border: 2px dashed #6a9c6a; /* Green dashed border */
            border-radius: 8px;
            padding: 40px 20px;
            text-align: center;
            cursor: pointer;
            color: #6a9c6a; /* Green text */
            font-size: 1.1rem;
            transition: background-color 0.3s ease, border-color 0.3s ease;
            margin-top: 1rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 150px;
        }

        .image-upload-area:hover {
            background-color: #e6f2e6; /* Lighter green on hover */
            border-color: #4e774e;
        }

        .image-upload-area img.uploaded-image {
            max-width: 100%;
            max-height: 200px;
            border-radius: 5px;
            margin-bottom: 10px;
            object-fit: contain; /* Ensure image fits without cropping */
        }
        .image-upload-area span.upload-text {
            margin-top: 10px;
        }


        textarea {
            resize: vertical;
            min-height: 80px;
        }

        .nutrition-inputs {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 1rem;
            margin-top: 1rem;
        }

        .nutrition-inputs input {
            text-align: center;
        }

        .tag-group {
            margin-top: 1rem;
            margin-bottom: 1.5rem;
        }

        .tag-group span {
            display: block;
            font-weight: 500;
            color: #333;
            margin-bottom: 0.5rem;
        }

        .tags-container {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .tag-button {
            background-color: #D9E2CE;
            color: #4e774e;
            border: 1px solid #D9E2CE;
            padding: 0.6rem 1rem;
            border-radius: 20px;
            cursor: pointer;
            transition: background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease;
            font-size: 0.9rem;
            font-weight: 500;
        }

        .tag-button.selected {
            background-color: #6a9c6a;
            color: white;
            border-color: #6a9c6a;
        }

        .tag-button:hover:not(.selected) {
            background-color: #c9d8bd;
        }

        .error-message {
            color: #D40A0A;
            font-size: 0.85rem;
            margin-top: 5px;
            display: block;
        }

        .instructions-list {
            list-style: none;
            padding: 0;
        }

        .instruction-item {
            display: flex;
            align-items: center;
            margin-bottom: 1rem;
            gap: 0.5rem;
        }

        .instruction-item span {
            font-weight: bold;
            color: #4e774e;
            font-size: 1.1rem;
            flex-shrink: 0;
        }

        .instruction-item input {
            flex-grow: 1;
        }

        .delete-step-btn {
            background-color: #D40A0A;
            color: white;
            border: none;
            border-radius: 4px;
            padding: 0.5rem 0.8rem;
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: 600;
            transition: background-color 0.3s ease;
            flex-shrink: 0;
        }

        .delete-step-btn:hover {
            background-color: #b00a0a;
        }

        .add-step-btn {
            background-color: #D9E2CE;
            color: #4e774e;
            border: 1px dashed #6a9c6a;
            padding: 0.8rem 1.5rem;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 600;
            margin-top: 1rem;
            display: block;
            width: fit-content;
            margin-left: auto;
            margin-right: auto;
            transition: background-color 0.3s ease, border-color 0.3s ease;
        }

        .add-step-btn:hover {
            background-color: #e6f2e6;
            border-color: #4e774e;
        }

        .submit-buttons {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            margin-top: 3rem;
        }

        .submit-btn,
        .cancel-btn {
            padding: 1rem 2rem;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1.1rem;
            font-weight: bold;
            transition: background-color 0.3s ease;
        }

        .submit-btn {
            background-color: #6a9c6a;
            color: white;
        }

        .submit-btn:hover {
            background-color: #5b875b;
        }

        .cancel-btn {
            background-color: transparent;
            color: #D40A0A;
            border: 1px solid #D40A0A;
        }

        .cancel-btn:hover {
            background-color: #ffe6e6;
            color: #b00a0a;
        }

        /* Basic CSS for the message-box */
        .message-box {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background-color: #4e774e;
            color: white;
            padding: 15px 25px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            display: flex;
            align-items: center;
            gap: 15px;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease, visibility 0.3s ease;
            z-index: 1000;
        }

        .message-box.show {
            opacity: 1;
            visibility: visible;
        }

        .message-box.error {
            background-color: #D40A0A;
        }

        .message-box button {
            background-color: rgba(255, 255, 255, 0.2);
            border: none;
            color: white;
            padding: 5px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            transition: background-color 0.2s ease;
        }

        .message-box button:hover {
            background-color: rgba(255, 255, 255, 0.4);
        }

        /* Style for the access denied message */
        #access-denied-message {
            text-align: center;
            margin-top: 50px;
            font-size: 1.5rem;
            color: #D40A0A;
            display: none; /* Hidden by default */
        }
    </style>
</head>

<body>
    <div id="loading-spinner" style="
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        width: 100%;
        position: fixed;
        top: 0;
        left: 0;
        background-color: rgba(255, 255, 255, 0.8);
        z-index: 9999;
        font-size: 1.5rem;
        color: #4e774e;
    ">
        Loading...
    </div>

    <div class="container" id="recipe-form-container" style="display: none;">
        <h1>Edit Recipe</h1>

        <div class="form-section">
            <h3>1. Recipe Image</h3>
            <div class="image-upload-area" id="image-upload-area">
                <input type="file" id="recipe-image-input" accept="image/*" style="display: none" />
                <img id="image-preview" class="uploaded-image" style="display: none" alt="Recipe Preview" />
                <span class="upload-text">Drop Image to preview or click</span>
            </div>
            <span class="error-message" id="image-error"></span>
        </div>

        <div class="form-section">
            <h3>2. Title</h3>
            <div class="form-group">
                <label>Recipe Title</label>
                <input type="text" placeholder="e.g., Chicken Salad" id="recipe-title-input">
                <span class="error-message" id="title-error"></span>
            </div>
        </div>

        <div class="form-section">
            <h3>3. Description</h3>
            <div class="form-group">
                <label>Short Description</label>
                <textarea placeholder="A brief overview..." id="recipe-description-input"></textarea>
                <span class="error-message" id="description-error"></span>
            </div>
        </div>

        <div class="form-section">
            <h3>4. Nutrition Facts</h3>
            <div class="nutrition-inputs">
                <input type="number" placeholder="Calories" id="nutrition-calories">
                <input type="number" placeholder="Carbs (g)" id="nutrition-carbs">
                <input type="number" placeholder="Protein (g)" id="nutrition-protein">
                <input type="number" placeholder="Fat (g)" id="nutrition-fat">
            </div>
            <span class="error-message" id="nutrition-calories-error"></span>
            <span class="error-message" id="nutrition-carbs-error"></span>
            <span class="error-message" id="nutrition-protein-error"></span>
            <span class="error-message" id="nutrition-fat-error"></span>
        </div>

        <div class="form-section">
            <h3>5. Tags</h3>

            <div class="tag-group">
                <span>Meal Type:</span>
                <div class="tags-container" id="meal-type-tags">
                    <button type="button" class="tag-button" data-tag="breakfast">Breakfast</button>
                    <button type="button" class="tag-button" data-tag="lunch">Lunch</button>
                    <button type="button" class="tag-button" data-tag="dinner">Dinner</button>
                    <button type="button" class="tag-button" data-tag="snacks">Snacks</button>
                    <button type="button" class="tag-button" data-tag="desserts">Desserts</button>
                </div>
                <span class="error-message" id="meal-type-error"></span>
            </div>

            <div class="tag-group">
                <span>Dietary:</span>
                <div class="tags-container" id="dietary-tags">
                    <button type="button" class="tag-button" data-tag="vegan">Vegan</button>
                    <button type="button" class="tag-button" data-tag="vegetarian">Vegetarian</button>
                    <button type="button" class="tag-button" data-tag="gluten-free">Gluten-Free</button>
                    <button type="button" class="tag-button" data-tag="high-protein">High-Protein</button>
                    <button type="button" class="tag-button" data-tag="keto">Keto</button>
                    <button type="button" class="tag-button" data-tag="low-carb">Low-Carb</button>
                </div>
                <span class="error-message" id="dietary-error"></span>
            </div>

            <div class="tag-group">
                <span>Time:</span>
                <div class="tags-container" id="time-tags">
                    <button type="button" class="tag-button" data-tag="under-15-mins">Under 15 mins</button>
                    <button type="button" class="tag-button" data-tag="under-30-mins">Under 30 mins</button>
                    <button type="button" class="tag-button" data-tag="under-1-hour">Under 1 hour</button>
                </div>
                <span class="error-message" id="time-error"></span>
            </div>

            <div class="tag-group">
                <span>Main Ingredient:</span>
                <div class="tags-container" id="main-ingredient-tags">
                    <button type="button" class="tag-button" data-tag="chicken">Chicken</button>
                    <button type="button" class="tag-button" data-tag="fish">Fish</button>
                    <button type="button" class="tag-button" data-tag="quinoa">Quinoa</button>
                    <button type="button" class="tag-button" data-tag="rice">Rice</button>
                    <button type="button" class="tag-button" data-tag="sweet-potato">Sweet Potato</button>
                    <button type="button" class="tag-button" data-tag="oat">Oat</button>
                </div>
                <span class="error-message" id="main-ingredient-error"></span>
            </div>
        </div>

        <div class="form-section">
            <h3>6. Steps</h3>
            <ul class="instructions-list" id="instructions-list">
            </ul>
            <button class="add-step-btn" id="add-step-btn">+ Add Step</button>
            <span class="error-message" id="instructions-error"></span>
        </div>

        <div class="form-section">
            <h3>7. Chef Name (Optional)</h3>
            <input type="text" placeholder="e.g., Fatima Jamal" id="chef-name-input">
        </div>

        <div class="submit-buttons">
            <button class="submit-btn" id="update-save-btn">Update Recipe</button>
            <button class="cancel-btn" id="cancel-btn">Cancel</button>
        </div>
    </div>

    <div id="access-denied-message" style="display: none;">
        You must be a chef to access this page. Redirecting...
    </div>

    <div id="message-box" class="message-box">
        <p id="message-box-text"></p>
        <button onclick="document.getElementById('message-box').classList.remove('show', 'error');">OK</button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-auth.js";
        import { getFirestore, doc, getDoc, collection, addDoc, updateDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore.js";
        // Firebase Storage imports are intentionally removed as per the new approach

        const firebaseConfig = {
            apiKey: "AIzaSyAOx5M2CvYKEtPbf7NCV43Pn0YHba3xDBA",
            authDomain: "freshfork-3db94.firebaseapp.com",
            projectId: "freshfork-3db94",
            storageBucket: "freshfork-3db94.appspot.com", 
            messagingSenderId: "519870760639",
            appId: "1:519870760639:web:8267f8fc8e3c220527680a",
            measurementId: "G-9NYYPXWTP7"
        };

        let app, auth, db;
        let currentUserId = null;
        let currentUserIsChef = false; // This will be set dynamically based on user's Firestore profile
        let currentFirestoreDocId = null;
        let selectedImageFile = null; // To hold the selected file object

        // Get elements for the new access control
        const recipeFormContainer = document.getElementById('recipe-form-container');
        const accessDeniedMessage = document.getElementById('access-denied-message');
        const loadingSpinner = document.getElementById('loading-spinner');


        try {
            app = initializeApp(firebaseConfig);
            auth = getAuth(app);
            db = getFirestore(app);
            console.log("Firebase initialized.");
        } catch (error) {
            console.error("Failed to initialize Firebase:", error);
            showMessageBox("Failed to initialize Firebase services. Please try again later.", true);
            // Hide loading spinner and show an error if Firebase fails to initialize
            loadingSpinner.style.display = 'none';
        }

        // --- DOM Elements ---
        const imageUploadArea = document.getElementById('image-upload-area');
        const recipeImageInput = document.getElementById('recipe-image-input');
        const recipeImagePreview = document.getElementById('image-preview');
        const uploadText = document.querySelector('.upload-text');
        const imageError = document.getElementById('image-error');

        const recipeTitleInput = document.getElementById('recipe-title-input');
        const titleError = document.getElementById('title-error');
        const recipeDescriptionInput = document.getElementById('recipe-description-input');
        const descriptionError = document.getElementById('description-error');

        const nutritionCalories = document.getElementById('nutrition-calories');
        const nutritionCarbs = document.getElementById('nutrition-carbs');
        const nutritionProtein = document.getElementById('nutrition-protein');
        const nutritionFat = document.getElementById('nutrition-fat');
        const nutritionCaloriesError = document.getElementById('nutrition-calories-error');
        const nutritionCarbsError = document.getElementById('nutrition-carbs-error');
        const nutritionProteinError = document.getElementById('nutrition-protein-error');
        const nutritionFatError = document.getElementById('nutrition-fat-error');

        const mealTypeTagsContainer = document.getElementById('meal-type-tags');
        const dietaryTagsContainer = document.getElementById('dietary-tags');
        const timeTagsContainer = document.getElementById('time-tags');
        const mainIngredientTagsContainer = document.getElementById('main-ingredient-tags');
        const mealTypeError = document.getElementById('meal-type-error');
        const dietaryError = document.getElementById('dietary-error');
        const timeError = document.getElementById('time-error');
        const mainIngredientError = document.getElementById('main-ingredient-error');

        const instructionsList = document.getElementById('instructions-list');
        const addStepBtn = document.getElementById('add-step-btn');
        const instructionsError = document.getElementById('instructions-error');

        const chefNameInput = document.getElementById('chef-name-input');
        const updateSaveBtn = document.getElementById('update-save-btn');
        const cancelBtn = document.getElementById('cancel-btn');

        // --- Helper function to show general custom message box ---
        function showMessageBox(message, isError = false, autoHideAndRedirect = true) {
            const messageBox = document.getElementById('message-box');
            const messageBoxText = document.getElementById('message-box-text');
            const messageBoxButton = messageBox.querySelector('button');

            messageBoxText.textContent = message;

            if (isError) {
                messageBox.classList.add('error');
                messageBoxButton.style.display = 'block'; // Show OK button for errors
            } else {
                messageBox.classList.remove('error');
                messageBoxButton.style.display = 'none'; // Hide OK button for success/info
            }
            
            messageBox.classList.add('show');

            if (autoHideAndRedirect && !isError) { // Only auto-hide and redirect on non-error messages
                setTimeout(() => {
                    messageBox.classList.remove('show');
                    window.location.href = 'Chef.html'; // Redirect to Chef.html on success
                }, 3000);
            }
        }

        // --- Clear all error messages ---
        function clearErrorMessages() {
            document.querySelectorAll('.error-message').forEach(el => el.textContent = '');
        }

        // --- Validate form inputs ---
        function validateForm() {
            clearErrorMessages();
            let isValid = true;

            if (recipeTitleInput.value.trim() === '') {
                titleError.textContent = 'Recipe title is required.';
                isValid = false;
            }
            if (recipeDescriptionInput.value.trim() === '') {
                descriptionError.textContent = 'Short description is required.';
                isValid = false;
            }

            const nutritionFields = {
                calories: { input: nutritionCalories, error: nutritionCaloriesError },
                carbs: { input: nutritionCarbs, error: nutritionCarbsError },
                protein: { input: nutritionProtein, error: nutritionProteinError },
                fat: { input: nutritionFat, error: nutritionFatError }
            };

            for (const key in nutritionFields) {
                const field = nutritionFields[key];
                if (field.input.value.trim() === '' || isNaN(field.input.value) || parseFloat(field.input.value) < 0) {
                    field.error.textContent = `${key.charAt(0).toUpperCase() + key.slice(1)} is required and must be a non-negative number.`;
                    isValid = false;
                }
            }

            const getSelectedTags = (container) => {
                return Array.from(container.querySelectorAll('.tag-button.selected')).map(button => button.dataset.tag);
            };

            const mealTypeSelected = getSelectedTags(mealTypeTagsContainer);
            if (mealTypeSelected.length === 0) {
                mealTypeError.textContent = 'At least one Meal Type is required.';
                isValid = false;
            }

            const dietarySelected = getSelectedTags(dietaryTagsContainer);
            if (dietarySelected.length === 0) {
                dietaryError.textContent = 'At least one Dietary tag is required.';
                isValid = false;
            }

            const timeSelected = getSelectedTags(timeTagsContainer);
            if (timeSelected.length === 0) {
                timeError.textContent = 'At least one Time tag is required.';
                isValid = false;
            }

            const mainIngredientSelected = getSelectedTags(mainIngredientTagsContainer);
            if (mainIngredientSelected.length === 0) {
                mainIngredientError.textContent = 'At least one Main Ingredient tag is required.';
                isValid = false;
            }

            const instructions = Array.from(instructionsList.querySelectorAll('.instruction-input')).map(input => input.value.trim());
            if (instructions.some(step => step === '')) {
                instructionsError.textContent = 'All instruction steps must be filled.';
                isValid = false;
            }
            if (instructions.length === 0) {
                instructionsError.textContent = 'At least one instruction step is required.';
                isValid = false;
            }

            // Validate image presence
            if (!recipeImagePreview.src || recipeImagePreview.src.includes('No+Image') || recipeImagePreview.style.display === 'none') {
                imageError.textContent = 'Recipe image is required.';
                isValid = false;
            }

            return isValid;
        }

        // --- Image Upload/Preview Logic ---
        imageUploadArea.addEventListener("click", () => {
            recipeImageInput.click();
        });

        recipeImageInput.addEventListener("change", (e) => {
            const file = e.target.files[0];
            if (file) {
                selectedImageFile = file; // Store the file object
                const reader = new FileReader();
                reader.onload = (evt) => {
                    recipeImagePreview.src = evt.target.result;
                    recipeImagePreview.style.display = "block";
                    uploadText.style.display = "none";
                    imageError.textContent = ''; // Clear error on new input
                };
                reader.readAsDataURL(file);
            } else {
                selectedImageFile = null;
                // If no file selected, revert to placeholder or hide image
                recipeImagePreview.src = 'https://placehold.co/200x200?text=No+Image'; // Placeholder
                recipeImagePreview.style.display = "block"; 
                uploadText.style.display = "block";
            }
        });

        imageUploadArea.addEventListener("dragover", (e) => {
            e.preventDefault();
            imageUploadArea.style.borderColor = "#4e774e";
        });

        imageUploadArea.addEventListener("dragleave", () => {
            imageUploadArea.style.borderColor = "#6a9c6a";
        });

        imageUploadArea.addEventListener("drop", (e) => {
            e.preventDefault();
            imageUploadArea.style.borderColor = "#6a9c6a";
            const file = e.dataTransfer.files[0];
            if (file) {
                recipeImageInput.files = e.dataTransfer.files; // Assign dropped file to input
                recipeImageInput.dispatchEvent(new Event("change")); // Trigger change event
            }
        });


        // --- Tag Selection Logic ---
        function setupTagSelection(containerId) {
            const container = document.getElementById(containerId);
            if (!container) return;
            container.querySelectorAll('.tag-button').forEach(tagButton => {
                tagButton.addEventListener('click', () => {
                    tagButton.classList.toggle('selected');
                    // Clear error when a tag is selected/deselected
                    const errorElemId = containerId.replace('-tags', '-error');
                    document.getElementById(errorElemId).textContent = '';
                });
            });
        }

        setupTagSelection('meal-type-tags');
        setupTagSelection('dietary-tags');
        setupTagSelection('time-tags');
        setupTagSelection('main-ingredient-tags');

        // --- Dynamic Instructions Logic ---
        function addInstructionStep(text = '') {
            const li = document.createElement('li');
            li.classList.add('instruction-item');
            const stepNumber = instructionsList.children.length + 1;
            li.innerHTML = `
                <span>${stepNumber}.</span>
                <input type="text" class="instruction-input" placeholder="Step description" value="${text}">
                <button type="button" class="delete-step-btn">X</button>
            `;
            instructionsList.appendChild(li);

            updateInstructionNumbers();

            li.querySelector('.delete-step-btn').addEventListener('click', (event) => {
                event.target.closest('li').remove();
                updateInstructionNumbers();
                if (instructionsList.children.length === 0) {
                    instructionsError.textContent = "At least one instruction step is required.";
                }
            });
            instructionsError.textContent = ''; // Clear error when a step is added
        }

        function updateInstructionNumbers() {
            Array.from(instructionsList.children).forEach((li, index) => {
                li.querySelector('span').textContent = `${index + 1}.`;
            });
        }

        addStepBtn.addEventListener('click', () => addInstructionStep());

        // --- Fetch and Populate Recipe Data (for editing) ---
        async function fetchAndPopulateRecipe(recipeDocId) {
            try {
                const recipeRef = doc(db, 'Recipes', recipeDocId);
                const recipeSnap = await getDoc(recipeRef);

                if (recipeSnap.exists()) {
                    const recipeData = recipeSnap.data();

                    // Authorization check: Only the creator can edit their recipe
                    if (recipeData.createdBy !== currentUserId) {
                        showMessageBox("You can only edit recipes that you created.", true);
                        // Redirect after showing error
                        setTimeout(() => { window.location.href = 'Chef.html'; }, 3000); 
                        return; // Stop execution
                    }

                    document.querySelector('h1').textContent = 'Edit Recipe';
                    updateSaveBtn.textContent = 'Update Recipe';

                    // Populate image from Base64 string
                    if (recipeData.imageData) {
                        recipeImagePreview.src = recipeData.imageData;
                        recipeImagePreview.style.display = 'block';
                        uploadText.style.display = 'none';
                    } else {
                        recipeImagePreview.src = 'https://placehold.co/200x200?text=No+Image';
                        recipeImagePreview.style.display = 'block';
                        uploadText.style.display = 'block';
                    }
                    selectedImageFile = null; // Clear any previously selected file for editing a loaded recipe

                    recipeTitleInput.value = recipeData.title || '';
                    recipeDescriptionInput.value = recipeData.description || '';

                    if (recipeData.nutrition) {
                        nutritionCalories.value = recipeData.nutrition.calories || '';
                        nutritionCarbs.value = recipeData.nutrition.carbs || '';
                        nutritionProtein.value = recipeData.nutrition.protein || '';
                        nutritionFat.value = recipeData.nutrition.fat || '';
                    }

                    const selectTags = (container, tagsString) => {
                        const tagsArray = tagsString ? tagsString.split(' ') : [];
                        container.querySelectorAll('.tag-button').forEach(tagButton => {
                            if (tagsArray.includes(tagButton.dataset.tag)) {
                                tagButton.classList.add('selected');
                            } else {
                                tagButton.classList.remove('selected');
                            }
                        });
                    };
                    // Use tags from recipeData
                    selectTags(mealTypeTagsContainer, recipeData.meal || '');
                    selectTags(dietaryTagsContainer, recipeData.dietary || '');
                    selectTags(timeTagsContainer, recipeData.timeToCook || '');
                    selectTags(mainIngredientTagsContainer, recipeData.mainIngredient || '');


                    instructionsList.innerHTML = ''; // Clear existing steps before populating
                    if (recipeData.instructions && Array.isArray(recipeData.instructions)) {
                        recipeData.instructions.forEach(step => addInstructionStep(step));
                    }
                    if (instructionsList.children.length === 0) { // Ensure at least one step if none came from data
                        addInstructionStep();
                    }

                    chefNameInput.value = recipeData.chefName || '';

                    currentFirestoreDocId = recipeDocId;
                } else {
                    console.log("Recipe not found for ID:", recipeDocId, "Treating as new recipe.");
                    // Fallback to new recipe mode if ID is present but not found
                    currentFirestoreDocId = null;
                    document.querySelector('h1').textContent = 'Add New Recipe';
                    updateSaveBtn.textContent = 'Save Recipe';
                    instructionsList.innerHTML = '';
                    addInstructionStep(); // Add initial empty step for new recipe
                    showMessageBox("No existing recipe found with that ID. Ready to add a new one.", false, false); // Don't auto-redirect for new recipe
                }
            } catch (error) {
                console.error("Error fetching recipe:", error);
                showMessageBox("Error loading recipe data: " + error.message + ". Treating as new recipe.", true);
                // If any error during fetch, assume new recipe creation
                currentFirestoreDocId = null;
                document.querySelector('h1').textContent = 'Add New Recipe';
                updateSaveBtn.textContent = 'Save Recipe';
                instructionsList.innerHTML = '';
                addInstructionStep(); // Add initial empty step for new recipe
            } finally {
                loadingSpinner.style.display = 'none'; // Hide spinner once data is loaded or error
                recipeFormContainer.style.display = 'block'; // Show the form (or error content)
            }
        }

        // --- Save/Update Recipe Function ---
        updateSaveBtn.addEventListener('click', async () => {
            if (!currentUserIsChef) {
                showMessageBox("You must be logged in as a chef to add/edit recipes.", true);
                return;
            }
            if (!currentUserId) {
                showMessageBox("You must be logged in to add/edit recipes.", true);
                return;
            }

            if (!validateForm()) {
                showMessageBox("Please fill in all required fields and correct errors.", true);
                return;
            }

            const recipeData = {
                title: recipeTitleInput.value.trim(),
                description: recipeDescriptionInput.value.trim(),
                nutrition: {
                    calories: parseFloat(nutritionCalories.value),
                    carbs: parseFloat(nutritionCarbs.value),
                    protein: parseFloat(nutritionProtein.value),
                    fat: parseFloat(nutritionFat.value)
                },
                meal: Array.from(mealTypeTagsContainer.querySelectorAll('.tag-button.selected')).map(btn => btn.dataset.tag).join(' '),
                dietary: Array.from(dietaryTagsContainer.querySelectorAll('.tag-button.selected')).map(btn => btn.dataset.tag).join(' '),
                timeToCook: Array.from(timeTagsContainer.querySelectorAll('.tag-button.selected')).map(btn => btn.dataset.tag).join(' '),
                mainIngredient: Array.from(mainIngredientTagsContainer.querySelectorAll('.tag-button.selected')).map(btn => btn.dataset.tag).join(' '),
                instructions: Array.from(instructionsList.querySelectorAll('.instruction-input')).map(input => input.value.trim()),
                chefName: chefNameInput.value.trim(),
                createdBy: currentUserId, // Store the UID of the chef who created/updated it
                lastModified: serverTimestamp() // Add/update timestamp
            };

            // Image handling (Base64 string)
            if (selectedImageFile) {
                const reader = new FileReader();
                reader.onload = async (e) => {
                    recipeData.imageData = e.target.result;
                    await saveRecipeToFirestore(recipeData);
                };
                reader.readAsDataURL(selectedImageFile);
            } else if (recipeImagePreview.src && !recipeImagePreview.src.includes('No+Image')) {
                // If no new file selected, but there's an existing image, keep it
                recipeData.imageData = recipeImagePreview.src;
                await saveRecipeToFirestore(recipeData);
            } else {
                recipeData.imageData = ''; // Or handle as null/undefined if image is optional
                await saveRecipeToFirestore(recipeData);
            }
        });

        async function saveRecipeToFirestore(recipeData) {
            try {
                if (currentFirestoreDocId) {
                    // Update existing recipe
                    const recipeRef = doc(db, 'Recipes', currentFirestoreDocId);
                    await updateDoc(recipeRef, recipeData);
                    showMessageBox("Recipe updated successfully!", false);
                    console.log("Recipe updated with ID: ", currentFirestoreDocId);
                } else {
                    // Add new recipe
                    const recipesCollectionRef = collection(db, 'Recipes');
                    const newDocRef = await addDoc(recipesCollectionRef, {
                        ...recipeData,
                        createdAt: serverTimestamp() // Add creation timestamp for new recipes
                    });
                    showMessageBox("New recipe added successfully!", false);
                    console.log("New recipe added with ID: ", newDocRef.id);
                }
            } catch (error) {
                console.error("Error saving recipe:", error);
                showMessageBox("Error saving recipe: " + error.message, true);
            }
        }

        // --- Cancel Button ---
        cancelBtn.addEventListener('click', () => {
            window.location.href = 'Chef.html'; // Redirect to Chef.html
        });

        // --- Firebase Authentication State Observer (Crucial for Chef Check) ---
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                currentUserId = user.uid;
                console.log("User logged in:", user.uid);

                try {
                    // Fetch user's profile from 'Users' collection to check 'isChef' status
                    const userDocRef = doc(db, 'Users', user.uid);
                    const userDocSnap = await getDoc(userDocRef);

                    if (userDocSnap.exists()) {
                        const userData = userDocSnap.data();
                        currentUserIsChef = !!userData.isChef; // Convert to boolean
                        console.log("User data from Firestore:", userData);
                        console.log("Is Chef:", currentUserIsChef);

                        if (currentUserIsChef) {
                            // Chef is logged in, proceed to load form
                            const urlParams = new URLSearchParams(window.location.search);
                            const recipeId = urlParams.get('id');
                            console.log("Attempting to load recipe ID:", recipeId);

                            if (recipeId) {
                                await fetchAndPopulateRecipe(recipeId);
                            } else {
                                // If no ID in URL, it's a new recipe creation
                                document.querySelector('h1').textContent = 'Add New Recipe';
                                updateSaveBtn.textContent = 'Save Recipe';
                                instructionsList.innerHTML = ''; // Clear steps for new recipe
                                addInstructionStep(); // Add first empty step
                                loadingSpinner.style.display = 'none';
                                recipeFormContainer.style.display = 'block';
                            }
                        } else {
                            // User is NOT a chef, deny access
                            console.warn("Access Denied: User is not a chef.");
                            loadingSpinner.style.display = 'none';
                            recipeFormContainer.style.display = 'none'; // Hide the form
                            accessDeniedMessage.textContent = "You are not authorized to access this page. Redirecting to home.";
                            accessDeniedMessage.style.display = 'block';
                            setTimeout(() => {
                                window.location.href = 'index.html'; // Redirect to a general home page or login
                            }, 3000);
                        }
                    } else {
                        // User document not found in 'Users' collection
                        console.warn("User document not found for UID:", user.uid, ". Treating as non-chef.");
                        loadingSpinner.style.display = 'none';
                        recipeFormContainer.style.display = 'none'; // Hide the form
                        accessDeniedMessage.textContent = "Your user profile could not be loaded. Please ensure your account is set up correctly. Redirecting to home.";
                        accessDeniedMessage.style.display = 'block';
                        setTimeout(() => {
                            window.location.href = 'index.html'; // Redirect to home or login page
                        }, 3000);
                    }
                } catch (error) {
                    console.error("Error fetching user profile or checking chef status:", error);
                    loadingSpinner.style.display = 'none';
                    recipeFormContainer.style.display = 'none'; // Hide the form
                    accessDeniedMessage.textContent = "Error verifying your chef status. Please try again. Redirecting to home.";
                    accessDeniedMessage.style.display = 'block';
                    setTimeout(() => {
                        window.location.href = 'index.html'; // Redirect on severe error
                    }, 3000);
                }
            } else {
                // No user logged in, deny access and redirect
                console.warn("No user logged in. Redirecting to login.");
                loadingSpinner.style.display = 'none';
                recipeFormContainer.style.display = 'none'; // Hide the form
                accessDeniedMessage.textContent = "You must be logged in to access this page. Redirecting to login.";
                accessDeniedMessage.style.display = 'block';
                setTimeout(() => {
                    window.location.href = 'Login.html'; // Redirect to your login page
                }, 3000);
            }
        });

    </script>
</body>

</html>
