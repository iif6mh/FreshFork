<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FreshFork - Edit Email</title>
    <style>
        /* Base Styles - Consistent with Forget Password page */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: "Inter", sans-serif;
            background-color: #FFFDF2; /* fresh-light-grey from Forget Password */
            color: #333; /* Default text color from Forget Password */
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 2rem; /* Overall padding */
        }

        .container {
            background-color: #FFFDF2; /* fresh-cream-bg from Forget Password */
            padding: 2.5rem; /* ~40px from Forget Password */
            border-radius: 0.5rem; /* Rounded corners for the main container from Forget Password */
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1); /* from Forget Password */
            width: 90%;
            max-width: 600px; /* Limit width on larger screens from Forget Password */
            text-align: center;
        }

        .header {
            text-align: left; /* from Forget Password */
            margin-bottom: 2rem; /* mb-8 from Forget Password */
        }

        .header h1 { /* Changed from h2 to h1 to match the HTML structure */
            font-size: 2.25rem; /* text-3xl from Forget Password */
            font-weight: bold;
            color: #4e774e; /* fresh-primary-green from Forget Password */
            margin-bottom: 1rem;
        }

        .instruction-text {
            font-size: 1.125rem; /* text-lg from Forget Password */
            color: #4b5563; /* text-gray-700 from Forget Password */
            margin-bottom: 2rem; /* Adjusted for consistency */
            text-align: center; /* from Forget Password */
            line-height: 1.5; /* Added for readability */
        }

        /* Form Group */
        .form-group {
            text-align: left; /* from Forget Password */
            margin-bottom: 1.5rem; /* mb-6 from Forget Password */
        }

        .form-group label {
            display: block;
            font-size: 0.875rem; /* text-sm from Forget Password */
            color: #4e774e; /* fresh-primary-green from Forget Password */
            margin-bottom: 0.5rem;
        }

        .form-group input[type="email"] {
            width: 100%;
            padding: 0.75rem; /* p-3 from Forget Password */
            border: 1px solid #ccc; /* fresh-border-grey from Forget Password */
            border-radius: 0.25rem; /* Rectangular from Forget Password */
            font-size: 1rem;
            color: #333; /* Default text color */
            outline: none;
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
            background-color: #F7F7F7; /* Light grey input background */
        }

        .form-group input:focus {
            border-color: #6a9c6a; /* fresh-light-green from Forget Password */
            box-shadow: 0 0 0 2px rgba(106, 156, 106, 0.2); /* from Forget Password */
            outline: none;
        }

        .required-star {
            color: #D40A0A; /* fresh-error-red from Forget Password */
            margin-left: 0.25rem;
        }

        /* Buttons */
        .action-buttons { /* Renamed from button-group to action-buttons to match current HTML */
            display: flex;
            flex-direction: column;
            gap: 1rem; /* space-y-4 from Forget Password */
            margin-top: 2rem; /* mt-8 from Forget Password */
        }

        .btn { /* Base style for all buttons */
            padding: 0.75rem 1.5rem; /* py-3 px-6 from Forget Password */
            font-size: 1rem;
            font-weight: 600;
            border: none;
            border-radius: 0.25rem; /* Rectangular from Forget Password */
            cursor: pointer;
            transition: background-color 0.3s ease, border-color 0.3s ease;
            width: 100%; /* Make buttons full width */
        }

        .btn-send { /* Primary button style */
            background-color: #6a9c6a; /* fresh-light-green from Forget Password */
            color: #FFFFFF; /* fresh-white from Forget Password */
        }

        .btn-send:hover {
            background-color: #5b875b; /* fresh-lighter-green-hover from Forget Password */
        }

        .btn-cancel { /* Secondary button style */
            background-color: transparent;
            color: #D40A0A; /* fresh-error-red from Forget Password */
            border: 1px solid #D40A0A; /* fresh-error-red from Forget Password */
        }

        .btn-cancel:hover {
            background-color: #ffebeb; /* Light red hover from Forget Password */
        }

        /* Message Box (consistent with previous versions, but adjusted colors) */
        .message-box {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: #6a9c6a; /* Green background for consistency */
            color: #fff;
            padding: 10px 20px;
            border-radius: 5px;
            font-size: 0.9rem;
            opacity: 0;
            transition: opacity 0.5s ease-in-out;
            z-index: 1001;
            text-align: center;
            font-family: "Inter", sans-serif;
            display: none; /* Hidden by default */
            flex-direction: column; /* To center button */
            align-items: center; /* To center button */
        }
        .message-box.show {
            opacity: 1;
            display: flex;
        }
        .message-box button {
            margin-top: 15px;
            padding: 8px 15px;
            background-color: #5b875b; 
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        .message-box.error {
            background-color: #D40A0A; /* Red background for error messages */
        }

        /* Error message for form validation */
        .error-message { /* Combined with message-text */
            color: #D40A0A; /* Red color for error messages */
            font-size: 0.875rem; /* from Forget Password */
            margin-top: 0.5rem;
            display: block;
            text-align: left;
        }

        /* Loading Spinner */
        .loading-spinner {
            display: none; /* Hidden by default */
            border: 4px solid #f3f3f3; /* Light grey */
            border-top: 4px solid #6a9c6a; /* Green */
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Responsive Adjustments from Forget Password */
        @media (max-width: 640px) {
            .container {
                padding: 1.5rem;
            }

            .header h1 { /* Changed from h2 to h1 */
                font-size: 1.75rem;
            }

            .instruction-text {
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Edit Email</h1>
        </div>

        <p class="instruction-text">
            Enter your new email address below. We'll send you a confirmation link.
        </p>

        <div class="form-group">
            <label for="new-email-input">Enter your New Email Here <span class="required-star">*</span></label>
            <input type="email" id="new-email-input" placeholder="User@gmail.com">
            <span id="email-error" class="error-message"></span>
        </div>

        <div class="loading-spinner" id="loading-spinner"></div>
        
        <div class="action-buttons">
            <button type="button" id="send-confirmation-btn" class="btn btn-send">Send Confirmation Email</button>
            <button type="button" id="cancel-btn" class="btn btn-cancel">Cancel</button>
        </div>
    </div>

    <!-- Message Box Element -->
    <div id="message-box" class="message-box">
        <p id="message-box-text"></p>
        <button onclick="document.getElementById('message-box').classList.remove('show', 'error');">OK</button>
    </div>

    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-app.js";
        import { getAuth, onAuthStateChanged, updateEmail, sendEmailVerification } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-auth.js";
        // Firestore is not directly needed for email update, but usually good to keep for consistency
        // import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore.js";

        // Global variables for Firebase config provided by the environment
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';
        // For Firebase JS SDK v7.20.0 and later, measurementId is optional
const firebaseConfig = {
  apiKey: "AIzaSyAOx5M2CvYKEtPbf7NCV43Pn0YHba3xDBA",
  authDomain: "freshfork-3db94.firebaseapp.com",
  projectId: "freshfork-3db94",
  storageBucket: "freshfork-3db94.firebasestorage.app",
  messagingSenderId: "519870760639",
  appId: "1:519870760639:web:8267f8fc8e3c220527680a",
  measurementId: "G-9NYYPXWTP7"
};
        // initialAuthToken is not directly used for email updates, as Firebase's updateEmail
        // typically requires re-authentication for security sensitive operations.

        // Initialize Firebase
        let app, auth; // db is not strictly needed for email update here
        let currentUser = null;

        try {
            app = initializeApp(firebaseConfig);
            auth = getAuth(app);
            console.log("Firebase initialized for Edit Email page.");
        } catch (error) {
            console.error("Failed to initialize Firebase:", error);
            showMessageBox("Failed to initialize Firebase services. Please try again later.", true);
        }

        // --- DOM Elements ---
        const newEmailInput = document.getElementById('new-email-input');
        const emailError = document.getElementById('email-error');
        const sendConfirmationBtn = document.getElementById('send-confirmation-btn');
        const cancelBtn = document.getElementById('cancel-btn');
        const loadingSpinner = document.getElementById('loading-spinner');

        // --- Helper function to show general custom message box ---
        function showMessageBox(message, isError = false) { 
            const messageBox = document.getElementById('message-box');
            const messageBoxText = document.getElementById('message-box-text');
            const messageBoxButton = messageBox.querySelector('button');

            messageBoxText.textContent = message;
            
            if (isError) {
                messageBox.classList.add('error');
                messageBoxButton.style.display = 'block'; 
            } else {
                messageBox.classList.remove('error');
                messageBoxButton.style.display = 'none'; 
                setTimeout(() => {
                    messageBox.classList.remove('show'); 
                }, 3000); 
            }
            messageBox.classList.add('show');
        }

        // --- Clear error messages ---
        function clearErrorMessages() {
            emailError.textContent = '';
        }

        // --- Validate email input ---
        function validateEmail(email) {
            if (email.trim() === '') {
                emailError.textContent = 'Email is required.';
                return false;
            }
            if (!email.includes('@') || !email.includes('.')) {
                emailError.textContent = 'Please enter a valid email address.';
                return false;
            }
            return true;
        }

        // --- Handle Send Confirmation Email Button Click ---
        sendConfirmationBtn.addEventListener('click', async () => {
            clearErrorMessages();
            const newEmail = newEmailInput.value.trim();

            if (!validateEmail(newEmail)) {
                return;
            }

            if (!currentUser) {
                showMessageBox("You must be logged in to change your email.", true);
                return;
            }

            // Check if the new email is the same as the current one
            if (currentUser.email === newEmail) {
                showMessageBox("The new email address is the same as your current email.", true);
                return;
            }

            loadingSpinner.style.display = 'block';
            sendConfirmationBtn.disabled = true;
            cancelBtn.disabled = true;

            try {
                await updateEmail(currentUser, newEmail);
                console.log("Email updated successfully in Firebase Auth.");

                // Send email verification to the new email
                await sendEmailVerification(currentUser); // This will send to the newly updated email
                console.log("Email verification sent to new email address.");

                showMessageBox("Your email has been updated! Please check your new email for a verification link.", false);
                newEmailInput.value = ''; // Clear input field

            } catch (error) {
                console.error("Error updating email:", error);
                let errorMessage = "Failed to update email. Please try again.";

                switch (error.code) {
                    case 'auth/invalid-email':
                        errorMessage = 'The new email address is invalid.';
                        break;
                    case 'auth/email-already-in-use':
                        errorMessage = 'This email address is already in use by another account.';
                        break;
                    case 'auth/requires-recent-login':
                        // This error indicates the user needs to re-authenticate
                        errorMessage = 'Please log in again to update your email. This is a security measure.';
                        showMessageBox(errorMessage, true);
                        // Optionally, redirect to login page for re-authentication
                        // window.location.href = 'login.html'; 
                        break;
                    case 'auth/network-request-failed':
                        errorMessage = 'Network error. Please check your internet connection.';
                        break;
                    default:
                        errorMessage = `Error: ${error.message}`;
                        break;
                }
                showMessageBox(errorMessage, true);
            } finally {
                loadingSpinner.style.display = 'none';
                sendConfirmationBtn.disabled = false;
                cancelBtn.disabled = false;
            }
        });

        // --- Handle Cancel Button Click ---
        cancelBtn.addEventListener('click', () => {
            // Redirect to a profile page or home page
            window.location.href = 'profile.html'; // Assuming a profile page exists
            // Or fallback to home: window.location.href = 'home-sign.html'; 
        });

        // --- Initialization on Auth State Changed ---
        document.addEventListener('DOMContentLoaded', () => {
            onAuthStateChanged(auth, (user) => {
                if (user) {
                    currentUser = user;
                    console.log("User logged in:", currentUser.uid, "Email:", currentUser.email);
                    // Optionally pre-fill current email, though it's typically a 'new email' input
                    // newEmailInput.value = currentUser.email; 
                } else {
                    currentUser = null;
                    console.log("No user is logged in.");
                    showMessageBox("Please log in to change your email.", true);
                    // Disable form elements if no user is logged in
                    newEmailInput.disabled = true;
                    sendConfirmationBtn.disabled = true;
                }
            });
        });
    </script>
</body>
</html>
