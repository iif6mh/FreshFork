<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FreshFork - Share Your Healthy Creation</title>
    <style>
        /* Base Styles */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: "Inter", sans-serif;
            background-color: #FFFDF2 ;
            color: #333;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .container {
            max-width: 900px; /* Adjusted max-width for the form content */
            margin: 20px auto; /* Centered with some vertical margin */
            padding: 1.5rem;
            background-color: #FFFDF2; /* Creamy background for the form area */
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        h1 {
            font-size: 2rem;
            font-weight: bold;
            color: #4e774e; /* Dark green for heading */
            text-align: center;
            margin-bottom: 2rem;
        }

        .form-section {
            margin-bottom: 2rem;
        }

        .form-section h3 {
            font-size: 1.25rem;
            font-weight: 600;
            color: #4e774e; /* Dark green for section titles */
            margin-bottom: 1rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
            color: #333;
        }

        input[type="text"],
        input[type="email"],
        input[type="number"],
        textarea {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 1rem;
            color: #333;
            background-color: white; /* White background for inputs */
        }

        textarea {
            resize: vertical;
            min-height: 80px;
        }

        .image-upload-area {
            border: 2px dashed #6a9c6a; /* Green dashed border */
            border-radius: 8px;
            padding: 40px 20px;
            text-align: center;
            cursor: pointer;
            color: #6a9c6a; /* Green text */
            font-size: 1.1rem;
            transition: background-color 0.3s ease, border-color 0.3s ease;
            margin-top: 1rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 150px;
        }

        .image-upload-area:hover {
            background-color: #e6f2e6; /* Lighter green on hover */
            border-color: #4e774e;
        }

        .image-upload-area img.uploaded-image {
            max-width: 100%;
            max-height: 200px;
            border-radius: 5px;
            margin-bottom: 10px;
            object-fit: contain; /* Ensure image fits without cropping */
        }
        .image-upload-area span.upload-text {
            margin-top: 10px;
        }


        .nutrition-inputs {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 1rem;
            margin-top: 1rem;
        }

        .nutrition-inputs input {
            text-align: center;
        }

        /* The .nutrition-inputs label CSS was removed to prevent labels from showing */
        /* .nutrition-inputs label {
            text-align: center;
            font-size: 0.9rem;
            color: #4e774e;
        } */

        .tag-group {
            margin-top: 1rem;
            margin-bottom: 1.5rem;
        }

        .tag-group span {
            display: block;
            font-weight: 500;
            color: #333;
            margin-bottom: 0.5rem;
        }

        .tags-container {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .tag-button {
            background-color: #D9E2CE; /* Light green/grey */
            color: #4e774e; /* Dark green text */
            border: 1px solid #D9E2CE; /* Match background */
            padding: 0.6rem 1rem;
            border-radius: 20px; /* Pill shape */
            cursor: pointer;
            transition: background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease;
            font-size: 0.9rem;
            font-weight: 500;
        }

        .tag-button.selected {
            background-color: #6a9c6a; /* Selected green */
            color: white;
            border-color: #6a9c6a;
        }

        .tag-button:hover:not(.selected) {
            background-color: #c9d8bd; /* Slightly darker on hover */
        }

        .instructions-list {
            list-style: none; /* Remove default list style */
            padding: 0;
        }

        .instruction-item {
            display: flex;
            align-items: center;
            margin-bottom: 1rem;
            gap: 0.5rem; /* Space between elements in the step */
        }

        .instruction-item span {
            font-weight: bold;
            margin-right: 0.5rem;
            color: #4e774e;
            font-size: 1.1rem;
            flex-shrink: 0; /* Prevent number from shrinking */
        }

        .instruction-item input {
            flex-grow: 1;
        }

        /* New style for the delete button */
        .delete-step-btn {
            background-color: #D40A0A; /* Red */
            color: white;
            border: none;
            border-radius: 4px;
            padding: 0.5rem 0.8rem;
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: 600;
            transition: background-color 0.3s ease;
            flex-shrink: 0; /* Prevent button from shrinking */
        }

        .delete-step-btn:hover {
            background-color: #b00a0a; /* Darker red */
        }


        .add-step-btn {
            background-color: #D9E2CE; /* Light green/grey */
            color: #4e774e; /* Dark green text */
            border: 1px dashed #6a9c6a; /* Green dashed border */
            padding: 0.8rem 1.5rem;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 600;
            margin-top: 1rem;
            display: block; /* Make it a block element to center */
            width: fit-content;
            margin-left: auto;
            margin-right: auto;
            transition: background-color 0.3s ease, border-color 0.3s ease;
        }

        .add-step-btn:hover {
            background-color: #e6f2e6;
            border-color: #4e774e;
        }

        .submit-buttons {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            margin-top: 3rem;
        }

        .submit-btn,
        .cancel-btn {
            padding: 1rem 2rem;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1.1rem;
            font-weight: bold;
            transition: background-color 0.3s ease;
        }

        .submit-btn:hover {
            background-color: #5b875b; /* Darker green */
        }

        .submit-btn {
            background-color: #6a9c6a; /* Green */
            color: white;
        }

        .cancel-btn {
            background-color: transparent;
            color: #D40A0A; /* Red text for Cancel */
            border: 1px solid #D40A0A; /* Red border for Cancel */
        }

        .cancel-btn:hover {
            background-color: #ffe6e6; /* Light red background on hover */
            color: #b00a0a; /* Darker red text on hover */
        }

        /* Error message styles */
        .error-message {
            color: #D40A0A; /* Red color */
            font-size: 0.85rem;
            margin-top: 5px;
            display: block;
        }

        /* Responsive adjustments */
        @media (max-width: 768px) {
            .container {
                margin: 10px auto;
                padding: 1rem;
            }
            .navbar-logo {
                font-size: 1.2rem;
            }
            .navbar-links {
                gap: 0.5rem;
            }
            .navbar-link, .logout-button {
                padding: 0.3rem 0.8rem;
                font-size: 0.9rem;
            }
            h1 {
                font-size: 1.7rem;
            }
            .form-section h3 {
                font-size: 1.1rem;
            }
            .nutrition-inputs {
                grid-template-columns: 1fr; /* Stack on small screens */
            }
            .tag-button {
                padding: 0.5rem 0.8rem;
                font-size: 0.85rem;
            }
            .add-step-btn {
                padding: 0.7rem 1rem;
                font-size: 0.9rem;
            }
            .submit-btn, .cancel-btn {
                padding: 0.8rem 1.5rem;
                font-size: 1rem;
            }
        }
   </style>
</head>
<body>

<div class="container">
  <h1>Share Your Healthy Creation</h1>

  <div class="form-section">
    <h3>1. Recipe Photo (for preview only)</h3>
    <div class="image-upload-area" id="image-upload-area">
      <input type="file" id="recipe-image-input" accept="image/*" style="display: none" />
      <img
        id="uploaded-image-preview"
        class="uploaded-image"
        style="display: none"
        alt="Recipe Preview"
      />
      <span class="upload-text">drop Image to preview or click</span>
    </div>
  </div>

  <div class="form-section">
    <h3>2. Recipe Title</h3>
    <input type="text" id="recipe-title" placeholder="e.g., Delicious Vegan Chili" />
    <span class="error-message" id="title-error"></span>
  </div>

  <div class="form-section">
    <h3>3. Short Description</h3>
    <textarea
      id="recipe-description"
      placeholder="A brief, enticing overview of your recipe..."
    ></textarea>
    <span class="error-message" id="description-error"></span>
  </div>

  <div class="form-section">
    <h3>4. Nutrition Facts</h3>
    <div class="nutrition-inputs">
      <div><input type="number" id="calories" placeholder="Calories" /></div>
      <div><input type="number" id="carbs" placeholder="Carbs" /></div>
      <div><input type="number" id="protein" placeholder="Protein" /></div>
      <div><input type="number" id="fat" placeholder="Fat" /></div>
    </div>
    <span class="error-message" id="nutrition-error"></span>
  </div>

  <div class="form-section">
    <h3>5. Tags</h3>

    <div class="tag-group">
      <span>Meal Type:</span>
      <div class="tags-container" id="meal-type-tags">
        <button type="button" class="tag-button" data-tag="breakfast">Breakfast</button>
        <button type="button" class="tag-button" data-tag="lunch">Lunch</button>
        <button type="button" class="tag-button" data-tag="dinner">Dinner</button>
        <button type="button" class="tag-button" data-tag="snacks">Snacks</button>
        <button type="button" class="tag-button" data-tag="desserts">Desserts</button>
      </div>
      <span class="error-message" id="meal-type-error"></span>
    </div>

    <div class="tag-group">
      <span>Dietary:</span>
      <div class="tags-container" id="dietary-tags">
        <button type="button" class="tag-button" data-tag="vegan">Vegan</button>
        <button type="button" class="tag-button" data-tag="vegetarian">Vegetarian</button>
        <button type="button" class="tag-button" data-tag="gluten-free">Gluten-Free</button>
        <button type="button" class="tag-button" data-tag="high-protein">High-Protein</button>
        <button type="button" class="tag-button" data-tag="keto">Keto</button>
        <button type="button" class="tag-button" data-tag="low-carb">Low-Carb</button>
      </div>
      <span class="error-message" id="dietary-error"></span>
    </div>

    <div class="tag-group">
      <span>Time:</span>
      <div class="tags-container" id="time-tags">
        <button type="button" class="tag-button" data-tag="under-15-mins">Under 15 mins</button>
        <button type="button" class="tag-button" data-tag="under-30-mins">Under 30 mins</button>
        <button type="button" class="tag-button" data-tag="under-1-hour">Under 1 hour</button>
      </div>
      <span class="error-message" id="time-error"></span>
    </div>

    <div class="tag-group">
      <span>Main Ingredient:</span>
      <div class="tags-container" id="main-ingredient-tags">
        <button type="button" class="tag-button" data-tag="chicken">Chicken</button>
        <button type="button" class="tag-button" data-tag="fish">Fish</button>
        <button type="button" class="tag-button" data-tag="quinoa">Quinoa</button>
        <button type="button" class="tag-button" data-tag="rice">Rice</button>
        <button type="button" class="tag-button" data-tag="sweet-potato">Sweet Potato</button>
        <button type="button" class="tag-button" data-tag="oat">Oat</button>
      </div>
      <span class="error-message" id="ingredient-error"></span>
    </div>
  </div>

  <div class="form-section">
    <h3>6. Step-by-Step Instructions</h3>
    <ol class="instructions-list" id="instructions-list">
      <li class="instruction-item">
        <span>1.</span>
        <input
          type="text"
          class="instruction-input"
          placeholder="e.g., Preheat oven to 375°F"
        />
        <button type="button" class="delete-step-btn">Delete</button>
      </li>
      <li class="instruction-item">
        <span>2.</span>
        <input
          type="text"
          class="instruction-input"
          placeholder="e.g., Chop vegetables into bite-sized pieces"
        />
        <button type="button" class="delete-step-btn">Delete</button>
      </li>
    </ol>
    <button type="button" class="add-step-btn" id="add-step-button">
      add another step
    </button>
    <span class="error-message" id="instructions-error"></span>
  </div>

  <div class="form-section">
    <h3>7. Chef Name (Optional)</h3>
    <input type="text" id="chef-name" placeholder="e.g., Chef John Doe" />
  </div>

  <div class="submit-buttons">
    <button type="submit" class="submit-btn" id="submit-recipe-button">
      Submit Recipe
    </button>
    <button type="button" class="cancel-btn" id="cancel-button">Cancel</button>
  </div>

  <div
    id="message-box"
    class="message-box"
    style="
      display: none;
      position: fixed;
      top: 30%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: #6a9c6a;
      color: white;
      padding: 1rem 2rem;
      border-radius: 8px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
      z-index: 1000;
      flex-direction: column;
      align-items: center;
    "
  >
    <p id="message-box-text"></p>
    <button
      onclick="document.getElementById('message-box').style.display = 'none';"
      style="
        margin-top: 1rem;
        background-color: white;
        color: #6a9c6a;
        border: none;
        border-radius: 5px;
        padding: 0.5rem 1rem;
        cursor: pointer;
      "
    >
      OK
    </button>
  </div>
</div>

<script type="module">
  import {
    initializeApp
  } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-app.js";
  import {
    getAuth,
    onAuthStateChanged,
    signOut
  } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-auth.js";
  import {
    getFirestore,
    collection,
    addDoc,
    serverTimestamp
  } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore.js";

 // For Firebase JS SDK v7.20.0 and later, measurementId is optional
const firebaseConfig = {
  apiKey: "AIzaSyAOx5M2CvYKEtPbf7NCV43Pn0YHba3xDBA",
  authDomain: "freshfork-3db94.firebaseapp.com",
  projectId: "freshfork-3db94",
  storageBucket: "freshfork-3db94.firebasestorage.app",
  messagingSenderId: "519870760639",
  appId: "1:519870760639:web:8267f8fc8e3c220527680a",
  measurementId: "G-9NYYPXWTP7"
};

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  let currentUserId = null;

  // Listen to auth state
  onAuthStateChanged(auth, (user) => {
    currentUserId = user ? user.uid : null;
    if (user) {
      console.log("User logged in:", user.uid);
    } else {
      console.log("User not logged in");
    }
  });


  // Image preview logic
  const imageUploadArea = document.getElementById("image-upload-area");
  const recipeImageInput = document.getElementById("recipe-image-input");
  const uploadedImagePreview = document.getElementById("uploaded-image-preview");
  const uploadText = document.querySelector(".upload-text");

  imageUploadArea.addEventListener("click", () => {
    recipeImageInput.click();
  });

  recipeImageInput.addEventListener("change", (e) => {
    const file = e.target.files[0];
    if (file) {
      const reader = new FileReader();
      reader.onload = (evt) => {
        uploadedImagePreview.src = evt.target.result;
        uploadedImagePreview.style.display = "block";
        uploadText.style.display = "none";
      };
      reader.readAsDataURL(file);
    } else {
      uploadedImagePreview.style.display = "none";
      uploadText.style.display = "block";
    }
  });

  imageUploadArea.addEventListener("dragover", (e) => {
    e.preventDefault();
    imageUploadArea.style.borderColor = "#4e774e";
  });

  imageUploadArea.addEventListener("dragleave", () => {
    imageUploadArea.style.borderColor = "#6a9c6a";
  });

  imageUploadArea.addEventListener("drop", (e) => {
    e.preventDefault();
    imageUploadArea.style.borderColor = "#6a9c6a";
    const file = e.dataTransfer.files[0];
    if (file) {
      recipeImageInput.files = e.dataTransfer.files;
      recipeImageInput.dispatchEvent(new Event("change"));
    }
  });

  // Tag selection logic
  function setupTagSelection(container) {
    container.addEventListener("click", (e) => {
      if (e.target.classList.contains("tag-button")) {
        e.target.classList.toggle("selected");
        const errorId = container.id.replace("-tags", "-error");
        const errorElem = document.getElementById(errorId);
        if (errorElem) errorElem.textContent = "";
      }
    });
  }

  setupTagSelection(document.getElementById("meal-type-tags"));
  setupTagSelection(document.getElementById("dietary-tags"));
  setupTagSelection(document.getElementById("time-tags"));
  setupTagSelection(document.getElementById("main-ingredient-tags"));

  // Instructions add/delete logic
  const instructionsList = document.getElementById("instructions-list");
  const addStepButton = document.getElementById("add-step-button");
  const instructionsError = document.getElementById("instructions-error");

  function renumberInstructions() {
    const items = instructionsList.querySelectorAll(".instruction-item");
    items.forEach((item, idx) => {
      const span = item.querySelector("span");
      if (span) span.textContent = `${idx + 1}.`;
    });
  }

  addStepButton.addEventListener("click", () => {
    const newIndex = instructionsList.children.length + 1;
    const li = document.createElement("li");
    li.className = "instruction-item";
    li.innerHTML = `
      <span>${newIndex}.</span>
      <input type="text" class="instruction-input" placeholder="Add step ${newIndex}" />
      <button type="button" class="delete-step-btn">Delete</button>
    `;
    instructionsList.appendChild(li);
    instructionsError.textContent = "";
  });

  instructionsList.addEventListener("click", (e) => {
    if (e.target.classList.contains("delete-step-btn")) {
      const li = e.target.closest(".instruction-item");
      if (li) {
        li.remove();
        renumberInstructions();
        if (instructionsList.children.length === 0) {
          instructionsError.textContent = "At least one instruction step is required.";
        }
      }
    }
  });

  // Form validation
  function validateForm() {
    let valid = true;
    // Clear all errors
    document.querySelectorAll(".error-message").forEach((el) => (el.textContent = ""));

    if (!document.getElementById("recipe-title").value.trim()) {
      document.getElementById("title-error").textContent = "Recipe title is required.";
      valid = false;
    }
    if (!document.getElementById("recipe-description").value.trim()) {
      document.getElementById("description-error").textContent = "Short description is required.";
      valid = false;
    }

    if (
      document.querySelectorAll("#meal-type-tags .tag-button.selected").length === 0
    ) {
      document.getElementById("meal-type-error").textContent =
        "Please select at least one Meal Type tag.";
      valid = false;
    }
    if (
      document.querySelectorAll("#dietary-tags .tag-button.selected").length === 0
    ) {
      document.getElementById("dietary-error").textContent =
        "Please select at least one Dietary tag.";
      valid = false;
    }
    if (
      document.querySelectorAll("#time-tags .tag-button.selected").length === 0
    ) {
      document.getElementById("time-error").textContent =
        "Please select at least one Time tag.";
      valid = false;
    }
    if (
      document.querySelectorAll("#main-ingredient-tags .tag-button.selected").length ===
      0
    ) {
      document.getElementById("ingredient-error").textContent =
        "Please select at least one Main Ingredient tag.";
      valid = false;
    }

    const instructions = Array.from(
      document.querySelectorAll(".instruction-input")
    ).map((input) => input.value.trim());

    if (instructions.length === 0 || instructions.some((step) => step === "")) {
      instructionsError.textContent =
        "Please fill in all instruction steps (at least one step required).";
      valid = false;
    }

    return valid;
  }

  // Submit recipe
  document
    .getElementById("submit-recipe-button")
    .addEventListener("click", async (e) => {
      e.preventDefault();

      if (!currentUserId) {
        alert("You must be logged in to add a recipe.");
        window.location.href = "signup.html";
        return;
      }

      if (!validateForm()) {
        return;
      }

      // Collect data
      const title = document.getElementById("recipe-title").value.trim();
      const description = document.getElementById("recipe-description").value.trim();
      const calories = Number(document.getElementById("calories").value) || 0;
      const carbs = Number(document.getElementById("carbs").value) || 0;
      const protein = Number(document.getElementById("protein").value) || 0;
      const fat = Number(document.getElementById("fat").value) || 0;

      function getSelectedTags(containerId) {
        return Array.from(
          document.querySelectorAll(`#${containerId} .tag-button.selected`)
        ).map((btn) => btn.dataset.tag);
      }

      const mealTypes = getSelectedTags("meal-type-tags");
      const dietaries = getSelectedTags("dietary-tags");
      const times = getSelectedTags("time-tags");
      const ingredients = getSelectedTags("main-ingredient-tags");

      const instructions = Array.from(
        document.querySelectorAll(".instruction-input")
      ).map((input) => input.value.trim());

      const chefName = document.getElementById("chef-name").value.trim();

      // Image preview as base64 string (optional)
      const imageData = uploadedImagePreview.src || null;

      // Prepare Firestore document
      const newRecipe = {
        title,
        description,
        nutrition: {
          calories,
          carbs,
          protein,
          fat,
        },
        tags: {
          mealTypes,
          dietaries,
          times,
          ingredients,
        },
        instructions,
        chefName: chefName || null,
        imageData,
        createdBy: currentUserId,
        createdAt: serverTimestamp(),
      };

      try {
        await addDoc(collection(db, "Recipes"), newRecipe);
        showMessage("Recipe submitted successfully! Redirecting...");
        setTimeout(() => {
  window.location.href = "Chef.html"; // it goes to Chef page 
}, 2000);

      } catch (error) {
        console.error("Error adding recipe: ", error);
        alert("Failed to submit recipe. Please try again.");
      }
    });

  // Cancel button clears form
  const cancelButton = document.getElementById("cancel-button");
if (cancelButton) {
  cancelButton.addEventListener("click", (e) => {
    e.preventDefault();
    window.location.href = "home-sign.html";
  });
}

  // Cancel button redirects to home-sign.html
const logoutLink = document.getElementById("logout-link");
if (logoutLink) {
  logoutLink.addEventListener("click", async (e) => {
    e.preventDefault();
    try {
      await signOut(auth);
      window.location.href = "signup.html";
    } catch (err) {
      alert("Error logging out");
      console.error(err);
    }
  });
}
  // Show message box
  function showMessage(msg) {
    const box = document.getElementById("message-box");
    const text = document.getElementById("message-box-text");
    text.textContent = msg;
    box.style.display = "flex";
  }
</script>
</body>
</html>
