<head>

    <title>FreshFork - Explore Recipes</title>
    <style>
        /* Base Styles */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: "Inter", sans-serif;
            background-color: #FFFDF2;
            color: #1a6e1a;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .container {
            max-width: 1200px;
            margin-left: auto;
            margin-right: auto;
            padding-left: 1rem;
            padding-right: 1rem;
        }

        /* Navbar */
        .navbar {
            background-color: #6a9c6a;
            padding: 1rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            width: 100%;
        }

        .navbar-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
        }

        .navbar-logo {
            color: #FFFDF2;
            font-size: 1.5rem;
            font-weight: bold;
            border-radius: 0.25rem;
            padding: 0.5rem;
            text-decoration: none;
            margin-right: 2rem;
        }

        .navbar-links {
            display: flex;
            gap: 1rem;
            align-items: center;
        }

        .navbar-link {
            color: #FFFDF2;
            text-decoration: none;
            padding: 0.5rem;
            border-radius: 0.25rem;
            transition: color 0.3s ease;
        }

        .navbar-link:hover {
            color: #4e774e;
        }

        .navbar-link.active {
            font-weight: bold;
            text-decoration: solid; 
        }

        .search-container {
            position: relative;
        }

        .search-input {
            padding-top: 0.5rem;
            padding-bottom: 0.5rem;
            padding-left: 2.5rem;
            padding-right: 1rem;
            border-radius: 0.25rem;
            background-color: #FFFDF2;
            color: #6a9c6a;
            border: none;
            outline: none;
            box-shadow: 0 0 0 2px transparent;
            transition: box-shadow 0.3s ease;
        }

        .search-input::placeholder {
            color: #6a9c6a;
        }

        .search-input:focus {
            box-shadow: 0 0 0 2px #6a9c6a;
        }

        .search-icon {
            position: absolute;
            left: 0.75rem;
            top: 50%;
            transform: translateY(-50%);
            width: 1.25rem;
            height: 1.25rem;
            color: #6a9c6a;
        }

        .logout-button {
            background-color: transparent;
            color: #D40A0A;
            padding-top: 0.5rem;
            padding-bottom: 0.5rem;
            padding-left: 1.5rem;
            padding-right: 1.5rem;
            border-radius: 0.25rem;
            border: none;
            cursor: pointer;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            transition: background-color 0.3s ease, color 0.3s ease;
            text-decoration: none;
            display: inline-block;
            font-weight: 600;
        }

        .logout-button:hover {
            background-color: #D40A0A;
            color: #FFFDF2; /* Changed to #FFFDF2 for better contrast on hover */
        }

        /* Main Content Specific Styles */
        main {
            flex-grow: 1;
            padding-top: 3rem;
            padding-bottom: 3rem;
        }

        .main-heading {
            font-size: 2.25rem;
            font-weight: bold;
            color: #4e774e;
            margin-bottom: 1.5rem;
            text-align: left;
        }

        .filter-section {
            position: relative;
            display: flex;
            align-items: center;
            margin-bottom: 2rem;
            justify-content: flex-start;
            gap: 1rem;
        }

        .filter-button {
            background-color: #FFFDF2;
            border: 1px solid #e0e0e0;
            border-radius: 0.25rem;
            padding: 0.5rem 1rem;
            font-size: 1rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: #6a9c6a;
            transition: background-color 0.3s ease;
            font-weight: 500;
        }

        .filter-button:hover {
            background-color: #D9E2CE;
        }

        .filter-button svg {
            width: 1rem;
            height: 1rem;
        }

        /* Filter Dropdown Styles */
        .filter-dropdown {
            position: absolute;
            top: 100%;
            left: 0;
            background-color: #FFFDF2;
            border: 1px solid #e0e0e0;
            border-radius: 0.5rem;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            padding: 1rem;
            z-index: 10;
            min-width: 250px;
            display: none;
            margin-top: 0.5rem;
        }

        .filter-dropdown.show {
            display: block;
        }

        .filter-group {
            margin-bottom: 1rem;
        }

        .filter-group-title {
            font-weight: bold;
            color: #4e774e;
            margin-bottom: 0.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
        }

        .filter-group-title svg {
            width: 1rem;
            height: 1rem;
            transition: transform 0.3s ease;
        }

        .filter-group-title.expanded svg {
            transform: rotate(180deg);
        }

        .filter-options {
            list-style: none;
            padding: 0;
            margin-left: 0.5rem;
            display: none; /* Hidden by default */
        }

        .filter-options.show {
            display: block;
        }

        .filter-options li {
            margin-bottom: 0.25rem;
        }

        .filter-options input[type="checkbox"] {
            margin-right: 0.5rem;
        }

        .recipe-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 2rem;
        }

        .recipe-card {
            background-color: #6a9c6a;
            border-radius: 0.5rem;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .image-wrapper {
            background-color: #6a9c6a;
            border-top-left-radius: 0.5rem;
            border-top-right-radius: 0.5rem;
            padding: 1.25rem;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .recipe-card-image {
            width: 400px;
            height: 250px;
            max-width: 100%;
            object-fit: cover;
            border-radius: 0.5rem;
            display: block;
        }
        
        .recipe-card-content {
            padding: 1rem;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .nutrition-actions-wrapper {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            padding-top: 1rem;
            margin-top: 1rem;
        }

        .recipe-card-nutrition {
            display: flex;
            justify-content: flex-start;
            gap: 1.5rem;
            font-size: 0.8rem;
            color: #1a6e1a;
            margin-top: 15px;
            margin-bottom: 0;
        }

        .nutrition-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            margin-bottom: 20px;
            line-height: 1.2;
        }

        .nutrition-item strong {
            color: #1a6e1a;
            font-size: 1rem;
            margin-right: 0;
            margin-bottom: 0.25rem;
        }

        .recipe-card-actions {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.5rem;
            padding-top: 0;
            border-top: none;
        }

        .action-icon-wrapper {
            background-color: #FFFDF2;
            border: 1px solid #ccc;
            border-radius: 0.25rem;
            padding: 0.4rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background-color 0.2s ease, border-color 0.2s ease;
            width: 2.25rem;
            height: 2.25rem;
        }

        .action-icon-wrapper:hover {
            background-color: #D9E2CE;
            border-color: #6a9c6a;
        }
        
        .action-icon-wrapper .action-icon {
            color: #333;
            width: 1.25rem;
            height: 1.25rem;
            padding: 0;
            border-radius: 0;
            display: block;
        }

        .action-icon-wrapper.heart:hover {
            background-color: #FFEBEE;
            border-color: #D40A0A;
        }

        .action-icon-wrapper.heart:hover .action-icon {
            color: #D40A0A;
        }

        .action-icon-wrapper.heart.liked .action-icon {
            color: #D40A0A;
            fill: #D40A0A; /* Added to fill the heart when liked */
        }

            color: #fff;

            z-index: 1001;

        }

            padding-bottom: 3rem;

}

        .contact-textarea {

        }

        .send-button {
            background-color: #5b875b;
            color: #FFFFFF;
            padding-top: 0.5rem;
            padding-bottom: 0.5rem;
            padding-left: 1.5rem;
            padding-right: 1.5rem;
            border-radius: 0.25rem;
            border: none;
            cursor: pointer;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);

        .send-button:hover {

        .contact-status {
            margin-top: 0.5rem;
            font-size: 0.875rem;
            color: #6a9c6a;
        }
        .contact-status.text-fresh-error-red {
            color: #D40A0A;
        }
        .contact-status.text-fresh-light-green {

        .footer-copyright {

            color: #4e774e;
            margin-top: 0.5rem;
            margin-bottom: 0.5rem;
            font-size: 0.875rem;
        }

        .user-info-display {
            text-align: center;
            color: #6a9c6a;
            margin-top: 0.5rem;
            font-size: 0.875rem;
        }

        /* Message Box styles for general alerts */
        .message-box {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: #6a9c6a;

            padding: 10px 20px;

            z-index: 1001;

            display: none;
        }
        .message-box.show {

        .message-box.error {
            background-color: #D40A0A;
        }

.recipe-card-content p {

}

    </style>
</head>

        const firebaseConfig = {

        // Initialize Firebase
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        } else {
            firebase.app(); // if already initialized, use the existing app
        }
        const auth = firebase.auth();
        const db = firebase.firestore();

        // Array to store all fetched recipes for filtering (not directly used by filterRecipes, but good to have)
        let allRecipes = [];

        // Function to filter recipes based on selected checkboxes and search input
        function filterRecipes() {
            const searchInput = document.getElementById('search-input').value.toLowerCase();
            const checkedMeals = Array.from(document.querySelectorAll('input[id^="meal-"]:checked')).map(cb => cb.value);
            const checkedDietary = Array.from(document.querySelectorAll('input[id^="dietary-"]:checked')).map(cb => cb.value);
            const checkedTime = Array.from(document.querySelectorAll('input[id^="time-"]:checked')).map(cb => cb.value);
            const checkedIngredients = Array.from(document.querySelectorAll('input[id^="ingredient-"]:checked')).map(cb => cb.value);

            // --- DEBUGGING LOGS START ---
            console.log('--- Filtering Recipes ---');
            console.log('Search Input:', searchInput);
            console.log('Selected Meals (checkbox values):', checkedMeals);
            console.log('Selected Dietary (checkbox values):', checkedDietary);
            console.log('Selected Time (checkbox values):', checkedTime);
            console.log('Selected Ingredients (checkbox values):', checkedIngredients);
            // --- DEBUGGING LOGS END ---

            const recipeCards = document.querySelectorAll('.recipe-card');
            let recipesShownCount = 0;

            recipeCards.forEach(card => {
                // These still read from data-attributes, which will be correctly set by fetchAndDisplayRecipes now
                const meal = card.getAttribute('data-meal').split(' ');
                const dietary = card.getAttribute('data-dietary').split(' ');
                const time = card.getAttribute('data-time-to-cook'); 
                const ingredients = card.getAttribute('data-main-ingredient').split(' ');
                const title = card.querySelector('.recipe-card-title').textContent.toLowerCase();
                const description = card.querySelector('.recipe-card-description').textContent.toLowerCase();
                const matchesSearch = searchInput === '' || title.includes(searchInput) || description.includes(searchInput);
                const matchesMeal = checkedMeals.length === 0 || checkedMeals.some(val => meal.includes(val));
                const matchesDietary = checkedDietary.length === 0 || checkedDietary.some(val => dietary.includes(val));
                const matchesTime = checkedTime.length === 0 || checkedTime.includes(time); 
                const matchesIngredients = checkedIngredients.length === 0 || checkedIngredients.some(val => ingredients.includes(val));

                if (matchesSearch && matchesMeal && matchesDietary && matchesTime && matchesIngredients) {
                    card.style.display = ''; // Show the card
                    recipesShownCount++;
                } else {
                    card.style.display = 'none'; // Hide the card
                }
            });
            console.log('Total recipes displayed:', recipesShownCount);
            console.log('--- End Filtering ---');
        }

function displayContactStatus(message, isError = false) {
    contactStatusDiv.textContent = message;

                    if (!filterDropdown.contains(event.target) && !filterButton.contains(event.target)) {

                });
            }

            // Filter group title toggle (expand/collapse)
            document.querySelectorAll('.filter-group-title').forEach(title => {

                    }
                });
            });
        });

        async function fetchAndDisplayRecipes() {
            const recipeGrid = document.getElementById('recipe-grid');
            recipeGrid.innerHTML = 'Loading recipes...'; 

            try {
                const user = auth.currentUser;
                if (!user) {
                    recipeGrid.innerHTML = '<p style="color: #D40A0A; text-align: center;">Please log in to see recipes.</p>';
                    return;
                }

                // Fetch liked recipes IDs for current user
                const likesSnapshot = await db.collection("Users").doc(user.uid).collection("Likes").get();
                const likedRecipeIds = new Set(likesSnapshot.docs.map(doc => doc.id));

                const snapshot = await db.collection("Recipes").get();
                recipeGrid.innerHTML = ''; // Clear loading message

                if (snapshot.empty) {
                    recipeGrid.innerHTML = '<p style="color: #4e774e; text-align: center;">No recipes found in the database.</p>';
                    return;
                }

                allRecipes = []; // Reset allRecipes array
                snapshot.forEach(doc => {
    const recipe = doc.data();
    const recipeId = doc.id;

    allRecipes.push({ id: recipeId, ...recipe });

    const mealTypesArray = Array.isArray(recipe.tags?.mealTypes) ? recipe.tags.mealTypes : [];
    const dietaryArray = Array.isArray(recipe.tags?.dietaries) ? recipe.tags.dietaries : [];
    const mainIngredientsArray = Array.isArray(recipe.tags?.ingredients) ? recipe.tags.ingredients : [];
   const timeToCookArray = Array.isArray(recipe.tags?.times)
    ? recipe.tags.times.map(t => t.toLowerCase())
    : [];

    const card = createRecipeCard({
        title: recipe.title || 'Untitled Recipe',
        description: recipe.description || 'No description available.',
        imageUrl: recipe.imageData || 'https://via.placeholder.com/400x250?text=Recipe+Image',
        nutrition: recipe.nutrition || {},
        meal: mealTypesArray,
        dietary: dietaryArray,
        timeToCook: timeToCookArray,
        mainIngredient: mainIngredientsArray
    }, recipeId, likedRecipeIds.has(recipeId));

    recipeGrid.appendChild(card);
});

                attachRecipeCardEventListeners();
                filterRecipes(); // Apply filters immediately after loading recipes
            } catch (error) {
                console.error("Error fetching recipes:", error);
                recipeGrid.innerHTML = '<p style="color: #D40A0A; text-align: center;">Error loading recipes. Please try again later.</p>';
            }
        }

     function attachRecipeCardEventListeners() {
    // Like/Unlike functionality
    document.querySelectorAll('.action-icon-wrapper.heart').forEach(button => {
        button.removeEventListener('click', handleLikeButtonClick);
        button.addEventListener('click', handleLikeButtonClick);
    });

    // Share functionality (FIXED CLASS SELECTOR)
    document.querySelectorAll('.action-icon-wrapper.share').forEach(button => {
        button.removeEventListener('click', handleShareButtonClick);

}


        async function handleLikeButtonClick() {
            const recipeId = this.dataset.recipeId;
            const user = auth.currentUser;
            if (!user) {
                showMessageBox("Please log in to like recipes.", "error");
                return;
            }

            const likesRef = db.collection("Users").doc(user.uid).collection("Likes").doc(recipeId);
            const isLiked = this.classList.contains('liked');

            try {
                if (isLiked) {
                    await likesRef.delete();
                    this.classList.remove('liked');
                    console.log(`Recipe ${recipeId} removed from Likes`);
                } else {
                    const recipeDoc = await db.collection("Recipes").doc(recipeId).get();
                    if (recipeDoc.exists) {
                        await likesRef.set({
                            likedAt: firebase.firestore.FieldValue.serverTimestamp(),
                            recipeData: recipeDoc.data() // Store recipe data for easier access in liked page
                        });
                        this.classList.add('liked');
                        console.log(`Recipe ${recipeId} added to Likes`);
                    } else {
                        console.warn(`Recipe with ID ${recipeId} not found in main Recipes collection.`);
                        showMessageBox("Could not like recipe: Recipe not found.", "error");
                    }
                }
            } catch (error) {
                console.error("Error updating like status:", error);
                showMessageBox("Error updating like status. Please try again.", "error");
            }
        }

       async function handleShareButtonClick() {
    const recipeId = this.dataset.recipeId;
    const recipeCard = this.closest('.recipe-card');
    const recipeLink = recipeCard ? recipeCard.href : window.location.href;

    try {
        if (navigator.share) {
            await navigator.share({
                title: 'Check out this recipe on FreshFork!',
                text: `I found a great recipe: ${recipeCard.querySelector('.recipe-card-title').textContent}`,
                url: recipeLink,
            });
            console.log('Recipe shared successfully');
        } else {
            await navigator.clipboard.writeText(recipeLink);
            showCopyMessage();
            console.log('Recipe link copied to clipboard');
        }
    } catch (error) {
        console.error('Error sharing/copying recipe link:', error);
    }
}

        copyMessage.classList.add('show');

            copyMessage.classList.remove('show');

        // Handle Logout
        function handleLogout(event) {
            event.preventDefault(); // Prevent default link behavior
            auth.signOut().then(() => {
                console.log("User signed out.");
                showMessageBox("You have been successfully logged out.", "success", () => {
                    window.location.href = 'signup.html'; // Redirect to signup page after logout
                });
            }).catch((error) => {
                console.error("Error signing out:", error);
                showMessageBox("Error logging out. Please try again.", "error");
            });
        }

        // Universal Message Box function
        function showMessageBox(message, type = "success", callback = null) {
            const messageBox = document.getElementById('signout-message-box');
            if (!messageBox) return;

            messageBox.innerHTML = `<p>${message}</p><button>OK</button>`;
            messageBox.classList.remove('success', 'error'); // Clear previous types
            messageBox.classList.add(type);
            messageBox.classList.add('show');

            const okButton = messageBox.querySelector('button');
            okButton.onclick = () => {
                messageBox.classList.remove('show');
                if (callback) {
                    callback();
                }
            };

            //  Auto-hide after some time if no callback (e.g., for info messages)
            if (!callback && type === "success") {
                setTimeout(() => {
                    messageBox.classList.remove('show');
                }, 3000);
            }
        }

        // Contact Form Functionality
        document.addEventListener('DOMContentLoaded', () => {
            const sendContactBtn = document.getElementById('send-contact-btn');
            const contactStatus = document.getElementById('contact-status');
            const contactEmailInput = document.getElementById('contact-email');
            const contactMessageTextarea = document.getElementById('contact-message');

            if (sendContactBtn) {
                sendContactBtn.addEventListener('click', async () => {
                    const email = contactEmailInput.value.trim();
                    const message = contactMessageTextarea.value.trim();

                    if (!email || !message) {
                        contactStatus.textContent = "Please fill in all fields.";
                        contactStatus.classList.add('text-fresh-error-red');
                        contactStatus.classList.remove('text-fresh-light-green');
                        return;
                    }

                    if (!/\S+@\S+\.\S+/.test(email)) {
                        contactStatus.textContent = "Please enter a valid email address.";
                        contactStatus.classList.add('text-fresh-error-red');
                        contactStatus.classList.remove('text-fresh-light-green');
                        return;
                    }

                    contactStatus.textContent = "Sending...";
                    contactStatus.classList.remove('text-fresh-error-red');
                    contactStatus.classList.add('text-fresh-light-green');

                    try {
                        await db.collection("contact_messages").add({
                            email: email,
                            message: message,
                            timestamp: firebase.firestore.FieldValue.serverTimestamp()
                        });
                        contactStatus.textContent = "Message sent successfully!";
                        contactStatus.classList.remove('text-fresh-error-red');
                        contactStatus.classList.add('text-fresh-light-green');
                        contactEmailInput.value = '';
                        contactMessageTextarea.value = '';
                    } catch (error) {
                        console.error("Error sending message:", error);
                        contactStatus.textContent = "Error sending message. Please try again.";
                        contactStatus.classList.add('text-fresh-error-red');
                        contactStatus.classList.remove('text-fresh-light-green');
                    }
                });
            }
        });
